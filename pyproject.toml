[project]
name = "wb-review-insights"
version = "0.2.0"
description = "Анализ отзывов конкурентов на Wildberries с помощью субагентов Claude Code"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
